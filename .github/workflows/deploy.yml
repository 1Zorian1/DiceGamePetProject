name: CI/CD Pipeline - Infrastructure & App Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-and-deploy:
    name: Provision AWS EC2 & Deploy Containerized App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Generate Public Key from Private Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh-keygen -y -f private_key.pem > public_key.pub
          echo "PUBLIC_KEY_CONTENT=$(cat public_key.pub)" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -var="public_key_content=${{ env.PUBLIC_KEY_CONTENT }}"
          echo "SERVER_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Пауза для завершення ініціалізації мережі та SSH на EC2
      - name: Wait for EC2 SSH to be ready
        run: sleep 30

      - name: Deploy Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Waiting for Docker installation on EC2..."
            until command -v docker &> /dev/null; do
              sleep 5
            done

            mkdir -p /home/ubuntu/dice-game-devops
            cd /home/ubuntu/dice-game-devops

            # Клонування/оновлення приватного репозиторію через системний GITHUB_TOKEN
            if [ ! -d .git ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            # Запуск контейнерів
            sudo docker compose down || true
            sudo docker compose up --build -d
            sudo docker image prune -f
